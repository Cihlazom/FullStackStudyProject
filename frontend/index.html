<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>BarcelonaLocal - Discover the City Like a Local</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
<header id="header">
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="#" class="logo">BarcelonaLocal</a>
            </div>

            <ul class="nav-menu" id="nav-menu">
                <li><a href="#" data-page="home" class="nav-link active">Home</a></li>
                <li><a href="#" data-page="profile" class="nav-link">Profile</a></li>
            </ul>

            <div class="auth-section" id="auth-section">
            </div>

            <div class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>
</header>

<main id="main-content">
    <section class="hero">
        <div class="container">
            <h1>Discover Barcelona Like a Local</h1>
            <p>Find the best restaurants, bars, events and connect with like-minded people</p>
            <button class="btn btn-primary btn-large" id="explore-btn">Start Exploring</button>
        </div>
    </section>

    <section class="search-section">
        <div class="container">
            <div class="search-container" id="search-container">
            </div>
        </div>
    </section>

    <section class="results-section">
        <div class="container">
            <div class="results-header">
                <h2 id="results-title">Popular Places</h2>
                <div class="view-controls">
                    <button class="view-btn active" data-view="grid">Grid</button>
                </div>
            </div>

            <div class="results-container" id="results-container">
            </div>

            <div class="load-more">
                <button class="btn btn-secondary" id="load-more-btn">Load More</button>
            </div>
        </div>
    </section>
</main>

<div class="modal" id="venue-modal">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <div id="modal-body">
        </div>
    </div>
</div>

<div class="loading-spinner" id="loading-spinner">
    <div class="spinner"></div>
</div>

<div class="toast-container" id="toast-container">
</div>

<script src="js/utils/cache-buster.js"></script>
<script src="config/config.js"></script>
<script src="js/utils/constants.js"></script>
<script src="js/utils/helpers.js"></script>
<script src="js/utils/storage.js"></script>
<script src="js/utils/router.js"></script>
<script src="js/utils/cssVersion.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/favorite-sync.js"></script>

<script src="js/components/navbar.js"></script>
<script src="js/components/search.js"></script>
<script src="js/components/venue-card.js"></script>

<script src="js/app.js"></script>
</body>
</html>
